<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sazuki AI Video Dubbing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kantumruy Pro', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-blue-400">ប្រព័ន្ធបម្លែងសម្លេងវីដេអូ AI 🇰🇭</h1>
            <p class="text-slate-400 text-sm">ប្តូរវីដេអូចិន ឱ្យទៅជារឿងនិយាយភាសាខ្មែរ (ជ្រើសរើសសំឡេងប្រុស/ស្រី)</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">តំណភ្ជាប់វីដេអូ (TikTok Link)៖</label>
                <input type="url" id="videoUrl" placeholder="បិទភ្ជាប់តំណភ្ជាប់នៅទីនេះ..." 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-sm text-white">
            </div>

            <!-- ជ្រើសរើសប្រភេទសម្លេង (Voice Selector) -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">ជ្រើសរើសសំឡេង AI៖</label>
                <select id="voiceType" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500">
                    <option value="male">👨 សំឡេងប្រុស (Male Voice)</option>
                    <option value="female">👩 សំឡេងស្រី (Female Voice)</option>
                </select>
            </div>

            <button onclick="processVideo()" id="submitBtn" 
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl transition duration-200">
                ចាប់ផ្តើមបកប្រែ និងបម្លែងសម្លេង 🚀
            </button>
        </div>

        <div id="resultContainer" class="hidden space-y-4 bg-slate-900 p-4 rounded-xl border border-slate-700">
            <div>
                <span class="text-xs text-green-400 font-semibold">អត្ថបទ/ចំណងជើងបកប្រែ៖</span>
                <p id="translatedTitle" class="text-sm font-medium text-white mt-1"></p>
            </div>

            <div class="relative rounded-lg overflow-hidden bg-black aspect-video flex items-center justify-center">
                <video id="videoPlayer" controls class="w-full h-full object-contain"></video>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "http://127.0.0.1:8000";

        async function processVideo() {
            const urlInput = document.getElementById("videoUrl").value.trim();
            const voiceType = document.getElementById("voiceType").value;
            const submitBtn = document.getElementById("submitBtn");
            const resultContainer = document.getElementById("resultContainer");
            const translatedTitle = document.getElementById("translatedTitle");
            const videoPlayer = document.getElementById("videoPlayer");

            if (!urlInput) {
                alert("សូមបញ្ចូលតំណភ្ជាប់វីដេអូជាមុនសិន!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ កំពុងដំណើរការ AI...";

            try {
                const response = await fetch(`${BACKEND_URL}/api/process-video`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: urlInput, voice_type: voiceType })
                });

                const data = await response.json();

                if (data.success) {
                    translatedTitle.innerText = data.title;
                    videoPlayer.src = data.play_url;
                    resultContainer.classList.remove("hidden");
                } else {
                    alert("មានបញ្ហា៖ " + (data.detail || "មិនអាចទាញយកបានទេ"));
                }
            } catch (error) {
                alert("មិនអាចតភ្ជាប់ទៅកាន់ Python Server ក្នុងទូរស័ព្ទបានទេ!");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "ចាប់ផ្តើមបកប្រែ និងបម្លែងសម្លេង 🚀";
            }
        }
    </script>
</body>
</html>
