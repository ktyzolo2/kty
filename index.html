<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sazuki AI Video Dubbing & Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-blue-400">ទាញយក និងបកប្រែវីដេអូ AI 🇰🇭</h1>
            <p class="text-slate-400 text-sm">បញ្ចូលតំណភ្ជាប់ (Link TikTok ឬ .mp4) ដើម្បីបកប្រែអត្ថបទ និងចាក់សម្លេងខ្មែរ</p>
        </div>

        <!-- Form សម្រាប់បញ្ចូល Link -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">តំណភ្ជាប់វីដេអូ (TikTok / MP4 Link)៖</label>
                <input type="url" id="videoUrl" placeholder="បិទភ្ជាប់តំណភ្ជាប់ (Link) នៅទីនេះ..." 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-sm text-white">
            </div>

            <button onclick="processVideo()" id="submitBtn" 
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl transition duration-200 flex items-center justify-center space-x-2">
                <span>ចាប់ផ្តើមដំណើរការ AI 🚀</span>
            </button>
        </div>

        <!-- ផ្នែកបង្ហាញលទ្ធផល និង Video Player -->
        <div id="resultContainer" class="hidden space-y-4 bg-slate-900 p-4 rounded-xl border border-slate-700">
            <div>
                <span class="text-xs text-green-400 font-semibold">ចំណងជើងបកប្រែរួច៖</span>
                <p id="translatedTitle" class="text-sm font-medium text-white mt-1"></p>
            </div>

            <!-- Video Player -->
            <div class="relative rounded-lg overflow-hidden bg-black aspect-video flex items-center justify-center">
                <video id="videoPlayer" controls class="w-full h-full object-contain"></video>
            </div>

            <div class="text-xs text-slate-400 flex items-center space-x-2">
                <span>💡 បានភ្ជាប់ ElevenLabs Dubbing API និងបកប្រែប្រព័ន្ធឥតគិតថ្លៃ!</span>
            </div>
        </div>
    </div>

    <script>
        // Server URL រត់ក្នុង Pydroid 3 (Localhost)
        const BACKEND_URL = "http://127.0.0.1:8000";

        async function processVideo() {
            const urlInput = document.getElementById("videoUrl").value.trim();
            const submitBtn = document.getElementById("submitBtn");
            const resultContainer = document.getElementById("resultContainer");
            const translatedTitle = document.getElementById("translatedTitle");
            const videoPlayer = document.getElementById("videoPlayer");

            if (!urlInput) {
                alert("សូមបញ្ចូលតំណភ្ជាប់វីដេអូជាមុនសិន!");
                return;
            }

            // ផ្លាស់ប្តូរប៊ូតុងពេលកំពុងដំណើរការ
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>⏳ កំពុងទាញយក និងបកប្រែ...</span>`;

            try {
                const response = await fetch(`${BACKEND_URL}/api/process-video`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();

                if (data.success) {
                    translatedTitle.innerText = data.title;
                    videoPlayer.src = data.play_url;
                    resultContainer.classList.remove("hidden");
                } else {
                    alert("មានបញ្ហា៖ " + (data.detail || "មិនអាចទាញយកវីដេអូបានទេ"));
                }
            } catch (error) {
                alert("មិនអាចតភ្ជាប់ទៅកាន់ Python Server ក្នុងទូរស័ព្ទបានទេ! សូមប្រាកដថាអ្នកបាន Run main.py ក្នុង Pydroid 3។");
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>ចាប់ផ្តើមដំណើរការ AI 🚀</span>`;
            }
        }
    </script>
</body>
</html>
