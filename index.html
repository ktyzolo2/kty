<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធបកប្រែវីដេអូជាសំឡេង AI ខ្មែរ</title>
    <style>
        body { font-family: 'Khmer OS Battambang', sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; margin-top: 20px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0369a1; }
        .result { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; display: none; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>ប្រព័ន្ធបកប្រែវីដេអូ ➔ សំឡេង AI 🇰🇭</h2>
    
    <label for="videoUrl">បញ្ចូលលីងវីដេអូ (YouTube, TikTok, Facebook):</label>
    <input type="text" id="videoUrl" placeholder="https://...">

    <label for="voiceType">ជ្រើសរើសសំឡេង:</label>
    <select id="voiceType">
        <option value="male">សំឡេងប្រុស (Samnang)</option>
        <option value="female">សំឡេងស្រី (Sreymom)</option>
    </select>

    <button onclick="processVideo()">ចាប់ផ្តើមដំណើរការ</button>

    <div class="result" id="resultBox">
        <p><strong>អត្ថបទបកប្រែខ្មែរ៖</strong></p>
        <p id="translatedText" style="color: #38bdf8;"></p>
        <p><strong>សំឡេង AI៖</strong></p>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<script>
    async function processVideo() {
        const url = document.getElementById("videoUrl").value.trim();
        const voice_type = document.getElementById("voiceType").value;
        const resultBox = document.getElementById("resultBox");
        const translatedText = document.getElementById("translatedText");
        const audioPlayer = document.getElementById("audioPlayer");

        if (!url) {
            alert("សូមបញ្ចូលលីងវីដេអូជាមុនសិន!");
            return;
        }

        alert("កំពុងដំណើរការទាញយកនិងបកប្រែ សូមរង់ចាំបន្តិច...");

        try {
            // តភ្ជាប់ទៅកាន់ Python Server នៅលើ Render ដែលអ្នកเพิ่ง Deploy ជោគជ័យ
            const response = await fetch("https://ai-hftz.onrender.com/api/process-video-voice", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ url: url, voice_type: voice_type })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                translatedText.innerText = data.translated_text;
                
                // បំលែង Base64 Audio ទៅជា File សំឡេងសម្រាប់ស្តាប់
                const audioBlob = b64toBlob(data.audio_base64, "audio/mp3");
                const audioUrl = URL.createObjectURL(audioBlob);
                audioPlayer.src = audioUrl;
                
                resultBox.style.display = "block";
                alert(data.message);
            } else {
                alert("មានបញ្ហា៖ " + (data.detail || "មិនអាចដំណើរការបានទេ"));
            }
        } catch (error) {
            alert("មិនអាចតភ្ជាប់ទៅកាន់ Python Server ក្នុង Render បានទេ! សូមពិនិត្យមើលការ Run Server របស់អ្នក។");
            console.error(error);
        }
    }

    function b64toBlob(b64Data, contentType='') {
        const byteCharacters = atob(b64Data);
        const byteArrays = [];
        for (let offset = 0; offset < byteCharacters.length; offset += 512) {
            const slice = byteCharacters.slice(offset, offset + 512);
            const byteNumbers = new Array(slice.length);
            for (let i = 0; i < slice.length; i++) {
                byteNumbers[i] = slice.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            byteArrays.push(byteArray);
        }
        return new Blob(byteArrays, {type: contentType});
    }
</script>

</body>
</html>
