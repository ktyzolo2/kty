<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sazuki Video Downloader - ទាញយកវីដេអូ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        header { background-color: #0284c7; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        .logo { font-size: 1.2rem; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 8px; }
        .tg-btn { background-color: #0369a1; color: #ffffff; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
        main { display: flex; justify-content: center; align-items: center; padding: 20px; flex-grow: 1; }
        .card { background-color: #1e293b; width: 100%; max-width: 480px; padding: 24px; border-radius: 16px; border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
        .title { color: #38bdf8; font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; font-size: 0.85rem; text-align: center; margin-bottom: 20px; }
        .input-group { position: relative; margin-bottom: 16px; }
        .input-group input { width: 100%; background-color: #0f172a; border: 1px solid #334155; color: #ffffff; padding: 12px 16px 12px 42px; border-radius: 12px; font-size: 0.9rem; outline: none; }
        .input-group input:focus { border-color: #38bdf8; }
        .input-group .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
        .submit-btn { width: 100%; background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%); color: #ffffff; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .loading { display: none; text-align: center; margin-top: 20px; }
        .spinner { width: 32px; height: 32px; border: 4px solid #38bdf8; border-top: 4px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result { display: none; margin-top: 20px; background-color: #0f172a; padding: 16px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.4); text-align: center; }
        .result h3 { color: #38bdf8; font-size: 0.95rem; margin-bottom: 12px; }
        .download-btn { display: block; background-color: #059669; color: #ffffff; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.9rem; width: 100%; text-align: center; border: none; cursor: pointer; }
        footer { background-color: #020617; text-align: center; padding: 14px; color: #64748b; font-size: 0.75rem; border-top: 1px solid #1e293b; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>📥</span> Sazuki Downloader</div>
        <a href="https://t.me/knogaming" target="_blank" class="tg-btn">ចូលរួម TG ឆាត</a>
    </header>

    <main>
        <div class="card">
            <h1 class="title">ទាញយកវីដេអូ TikTok</h1>
            <p class="subtitle">ដាក់តំណរភ្ជាប់ (Link) ពី TikTok នៅទីនេះ</p>

            <form id="downloadForm">
                <div class="input-group">
                    <span class="icon">🔗</span>
                    <input type="url" id="videoUrl" required placeholder="បិទភ្ជាប់តំណរភ្ជាប់ TikTok...">
                </div>
                <button type="submit" class="submit-btn">ចាប់ផ្តើមទាញយក ⚡</button>
            </form>

            <div id="loadingState" class="loading">
                <div class="spinner"></div>
                <p style="color: #38bdf8; font-size: 0.85rem;">ប្រព័ន្ធកំពុងទាញយកទិន្នន័យ...</p>
            </div>

            <div id="resultSection" class="result">
                <h3 id="videoTitle">✅ ទាញយកវីដេអូได้สำเร็จ!</h3>
                <a id="downloadLinkBtn" href="#" class="download-btn" target="_blank">⬇️ ទាញយកវីដេអូចូលទូរស័ព្ទ (MP4)</a>
            </div>
        </div>
    </main>

    <footer>&copy; 2026 Sazuki Top Up & Downloader. រក្សាសិទ្ធិគ្រប់យ៉ាង។</footer>

    <script>
        const form = document.getElementById('downloadForm');
        const loadingState = document.getElementById('loadingState');
        const resultSection = document.getElementById('resultSection');
        const downloadLinkBtn = document.getElementById('downloadLinkBtn');
        const videoTitle = document.getElementById('videoTitle');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const urlInput = document.getElementById('videoUrl').value;
            if(!urlInput) return;

            loadingState.style.display = 'block';
            resultSection.style.display = 'none';

            try {
                // ใช้ Free Public API สำหรับดึงข้อมูล TikTok โดยไม่ต้องใช้ Backend
                const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                loadingState.style.display = 'none';

                if(data && data.code === 0) {
                    resultSection.style.display = 'block';
                    videoTitle.innerText = `✅ ${data.data.title || 'ទាញយកបានសម្រេច!'}`;
                    
                    // ดึงลิงก์สำหรับดาวน์โหลดไฟล์ MP4 แบบไม่มีลายน้ำ (No Watermark)
                    downloadLinkBtn.href = data.data.play;
                } else {
                    alert('ไม่สามารถดึงข้อมูลวิดีโอได้ กรุณาตรวจสอบลิงก์อีกครั้ง!');
                }
            } catch (error) {
                loadingState.style.display = 'none';
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อกับ API!');
                console.error(error);
            }
        });
    </script>
</body>
</html>
